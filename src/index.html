<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code5 Launcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="titlebar">
        <div class="titlebar-brand">
          <img src="../assets/code5-icon.png" alt="" />
          <span>Code5 Launcher</span>
        </div>
        <div class="window-actions">
          <button id="minimize" class="icon-button" type="button" title="Свернуть" aria-label="Свернуть">
            <i data-lucide="minus"></i>
          </button>
          <button id="close" class="icon-button close-button" type="button" title="Закрыть" aria-label="Закрыть">
            <i data-lucide="x"></i>
          </button>
        </div>
      </header>

      <div class="launcher-body">
        <aside class="rail" aria-label="Навигация">
          <div class="rail-mark">
            <img src="../assets/code5-icon.png" alt="Code5" />
          </div>
          <button class="rail-button active" type="button" title="Главная" aria-label="Главная">
            <i data-lucide="house"></i>
          </button>
          <div class="rail-spacer"></div>
          <button id="open-settings" class="rail-button" type="button" title="Настройки" aria-label="Настройки">
            <i data-lucide="settings"></i>
          </button>
          <span class="rail-status" title="Лаунчер готов"></span>
        </aside>

        <main class="content">
          <section class="account-row">
            <label class="account-field" for="nick">
              <i data-lucide="user-round"></i>
              <span class="field-copy">
                <small>Игрок</small>
                <input
                  id="nick"
                  type="text"
                  maxlength="16"
                  placeholder="Введите ник"
                  autocomplete="off"
                  spellcheck="false"
                />
              </span>
              <i class="verified" data-lucide="badge-check"></i>
            </label>
          </section>

          <section class="showcase">
            <div class="brand-intro">
              <img class="hero-logo" src="../assets/code5-icon.png" alt="Code5" />
              <p>Minecraft Launcher</p>
              <h1>Code5</h1>
              <span class="brand-accent" aria-hidden="true"></span>
            </div>

            <section class="skin-studio" aria-labelledby="skin-title">
              <div class="skin-heading">
                <div>
                  <p class="eyebrow">Персонаж</p>
                  <h2 id="skin-title">Ваш скин</h2>
                </div>
                <div class="skin-actions">
                  <button id="choose-skin" class="choose-skin" type="button">
                    <i data-lucide="upload"></i>
                    <span>Выбрать PNG</span>
                  </button>
                  <button id="reset-skin" class="skin-icon-button" type="button" title="Вернуть стандартный скин" aria-label="Вернуть стандартный скин">
                    <i data-lucide="rotate-ccw"></i>
                  </button>
                </div>
              </div>

              <div class="skin-viewer-wrap">
                <canvas id="skin-viewer" aria-label="Трёхмерная модель персонажа"></canvas>
                <span id="skin-state" class="skin-state">Стандартный</span>
              </div>

              <div class="skin-toolbar">
                <div class="model-toggle" aria-label="Тип модели">
                  <button class="model-option active" type="button" data-model="default">Обычные</button>
                  <button class="model-option" type="button" data-model="slim">Тонкие</button>
                </div>
                <span id="skin-file" class="skin-file">Hermit</span>
              </div>
            </section>
          </section>

          <footer class="launch-dock">
            <button id="play" class="play-button" type="button">
              <i data-lucide="play"></i>
              <span>Играть</span>
            </button>

            <div class="launch-progress">
              <div class="progress-copy">
                <strong id="percent">0%</strong>
                <span id="status" aria-live="polite">Проверяем обновления</span>
              </div>
              <div
                class="progress-track"
                role="progressbar"
                aria-label="Подготовка игры"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <div id="bar" class="progress-fill"></div>
              </div>
              <p id="error" class="error-message" aria-live="assertive"></p>
            </div>
          </footer>
        </main>
      </div>

      <div id="settings-backdrop" class="settings-backdrop" hidden>
        <aside id="settings-panel" class="settings-panel" aria-hidden="true" aria-labelledby="settings-title">
          <header class="settings-header">
            <div>
              <p class="eyebrow">Code5</p>
              <h2 id="settings-title">Настройки</h2>
            </div>
            <button id="close-settings" class="settings-close" type="button" title="Закрыть настройки" aria-label="Закрыть настройки">
              <i data-lucide="x"></i>
            </button>
          </header>

          <section class="settings-section">
            <div class="setting-heading">
              <i data-lucide="palette"></i>
              <span>Тема</span>
            </div>
            <div class="theme-options" aria-label="Тема оформления">
              <button class="theme-option active" type="button" data-theme="system">
                <i data-lucide="monitor"></i>
                <span>Система</span>
              </button>
              <button class="theme-option" type="button" data-theme="dark">
                <i data-lucide="moon"></i>
                <span>Тёмная</span>
              </button>
              <button class="theme-option" type="button" data-theme="light">
                <i data-lucide="sun"></i>
                <span>Светлая</span>
              </button>
            </div>
          </section>

          <section class="settings-section">
            <div class="setting-heading memory-heading">
              <span class="setting-title"><i data-lucide="memory-stick"></i><span>Память для игры</span></span>
              <output id="memory-value" for="memory">3 ГБ</output>
            </div>
            <input id="memory" class="memory-slider" type="range" min="2" max="12" step="1" value="3" />
            <div class="memory-scale" aria-hidden="true"><span>2 ГБ</span><span>12 ГБ</span></div>
          </section>

          <section class="settings-section setting-row">
            <span class="setting-title"><i data-lucide="rotate-3d"></i><span>Вращение модели</span></span>
            <label class="switch" title="Вращение 3D-модели">
              <input id="auto-rotate" type="checkbox" checked />
              <span class="switch-track"></span>
            </label>
          </section>

          <section class="settings-section settings-actions">
            <button id="open-folder" class="settings-action" type="button">
              <i data-lucide="folder-open"></i>
              <span>Папка игры</span>
              <i data-lucide="chevron-right"></i>
            </button>
          </section>

          <div class="settings-spacer"></div>
          <button id="reset-settings" class="reset-settings" type="button">
            <i data-lucide="refresh-ccw"></i>
            <span>Сбросить настройки</span>
          </button>
        </aside>
      </div>
    </div>

    <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script src="../node_modules/skinview3d/bundles/skinview3d.bundle.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
